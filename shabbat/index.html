<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lecha Dodi · IVRAHIM</title>

<link rel="icon" href="/img/favicon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png" sizes="180x180">

<meta property="og:description" content="Classic Jewish hymn to welcome in a restful weekend.">

<meta property="og:image:height" content="1000">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Lecha Dodi · IVRAHIM">
<meta name="twitter:description" content="Classic Jewish hymn to welcome in a restful weekend.">
<meta name="twitter:image" content="https://ivrahim.com/img/listen-cover.jpg">
<link rel="preload" href="/fonts/kalice-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:'Kalice';src:url('/fonts/kalice-400.woff2') format('woff2');font-weight:400;font-display:swap;}
  @font-face{font-family:'Lining';src:url('/fonts/lining-400.woff2') format('woff2'),url('/fonts/lining-400.woff') format('woff');font-weight:400;font-display:swap;}
  :root{
    --bone:#F4EFE6; --char:#1C1917;
    --bronze:#8C6239; --copper:#A85A31; --peach:#E8C0A4; --coppergold:#D18B3C;
    --ink:#3a332c; --hair-dark:rgba(232,192,164,.24);
    --on-dark:rgba(244,239,230,.88); --on-dark-mute:rgba(232,192,164,.66);
    --peach-ramp:linear-gradient(150deg,#F3D9C6 0%,#E8C0A4 48%,#C9977A 100%);
    --display:'Kalice',Georgia,serif;
    --text:'Lining','Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--char);color:var(--on-dark);font-family:var(--text);
    font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--peach);outline-offset:4px;}

  .card{max-width:1080px;margin:0 auto;padding:28px 22px 64px;
    display:grid;gap:28px;align-items:center;}
  .cover{aspect-ratio:1;overflow:hidden;background:#2a2320;}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .mark{display:inline-block;margin-bottom:30px;}
  .mark img{width:112px;height:auto;display:block;}

  .note{border-left:1px solid var(--peach);padding:2px 0 2px 16px;margin-bottom:26px;
    color:var(--on-dark);font-size:16px;max-width:40ch;}
  .set{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--peach);margin-bottom:12px;}
  h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.08;
    letter-spacing:-.01em;color:var(--peach);}
  .desc{margin-top:10px;color:var(--on-dark);max-width:42ch;min-height:1.6em;}

  .player{display:flex;align-items:center;gap:18px;margin-top:30px;}
  .play{flex:none;width:64px;height:64px;border-radius:50%;background:var(--peach-ramp);
    display:grid;place-items:center;transition:transform .15s ease;}
  .play:active{transform:scale(.96);}
  .play svg{width:22px;height:22px;fill:var(--char);}
  .play .i-pause{display:none;}
  .playing .play .i-play{display:none;}
  .playing .play .i-pause{display:block;}
  .seekwrap{flex:1;min-width:0;}
  .seek{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;}
  .seek::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--peach) var(--p,0%),var(--hair-dark) var(--p,0%));}
  .seek::-moz-range-track{height:2px;background:linear-gradient(90deg,var(--peach) var(--p,0%),var(--hair-dark) var(--p,0%));}
  .seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--peach);margin-top:-5px;}
  .seek::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--peach);}
  .times{display:flex;justify-content:space-between;font-size:13px;color:var(--on-dark-mute);
    font-variant-numeric:tabular-nums;margin-top:2px;}

  .tracks{list-style:none;margin-top:30px;border-top:1px solid var(--hair-dark);}
  .tracks button{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:10px;
    align-items:baseline;text-align:left;padding:12px 0;border-bottom:1px solid var(--hair-dark);}
  .tracks .n,.tracks .d{font-size:13px;color:var(--on-dark-mute);font-variant-numeric:tabular-nums;}
  .tracks .on .t{color:var(--peach);}
  .tracks .on .n{color:var(--peach);}
  .tracks.compact{display:flex;flex-wrap:wrap;gap:6px 26px;border-top:0;margin-top:26px;}
  .tracks.compact button{display:block;width:auto;padding:6px 0 7px;border-bottom:1px solid transparent;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-mute);
    transition:color .2s ease,border-color .2s ease;}
  .tracks.compact button:hover{color:var(--peach);}
  .tracks.compact .on{border-bottom-color:var(--peach);}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;}
  .chip{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--peach);
    padding:11px 18px;box-shadow:inset 0 0 0 1px var(--hair-dark);transition:background .2s ease,color .2s ease;}
  .chip:hover{background:var(--peach);color:var(--char);}

  .stay{background:var(--bone);color:var(--ink);padding:64px 22px;}
  .stay-in{max-width:1080px;margin:0 auto;}
  .stay h2{font-family:var(--display);font-weight:400;font-size:28px;color:var(--char);line-height:1.2;margin-bottom:8px;}
  .signup-frame{display:block;width:100%;max-width:640px;height:230px;border:0;margin-top:22px;}
  .signup-confirmation{font-family:var(--display);font-size:24px;color:var(--char);margin-top:22px;}
  .signup-confirmation:focus{outline:none;}
  .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;}
  .cta{display:inline-block;padding:15px 30px;background:var(--bronze);color:var(--bone);text-decoration:none;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:background .2s ease;}
  .cta:hover{background:var(--copper);}
  .cta.ghost{background:none;color:var(--bronze);box-shadow:inset 0 0 0 1px var(--bronze);}
  .cta.ghost:hover{background:var(--bronze);color:var(--bone);}
  .stay .cta:focus-visible{outline-color:var(--bronze);}
  footer{padding:36px 22px;font-size:13px;color:var(--on-dark-mute);}
  footer p{max-width:1080px;margin:0 auto;}
  footer a{color:var(--peach);}

  @media (min-width:860px){
    .card{grid-template-columns:1fr 1fr;gap:64px;padding:56px 40px 96px;min-height:92vh;}
    h1{font-size:52px;}
    .stay{padding:80px 40px;}
    footer{padding:40px;}
  }
</style>
</head>
<body>
<main class="card" id="card">
  <figure class="cover"><img src="/img/listen-cover.webp" width="1200" height="1200" alt="IVRAHIM reclining on velvet in a copper robe."></figure>
  <div class="info">
    <a class="mark" href="/"><img src="/img/ivrahim-wordmark-bone.svg" alt="IVRAHIM"></a>
    
    <h1 id="title">Lecha Dodi</h1>
    <p class="desc" id="desc">Classic Jewish hymn to welcome in a restful weekend.</p>
    <div class="player">
      <button class="play" id="play" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <div class="seekwrap">
        <input class="seek" id="seek" type="range" min="0" max="226" step="1" value="0" aria-label="Position">
        <div class="times"><span id="cur">0:00</span><span id="dur">3:46</span></div>
      </div>
    </div>
    <ol class="tracks compact" aria-label="Songs"><li><button type="button"><span class="t">Lecha Dodi</span></button></li><li><button type="button"><span class="t">Adon Olam</span></button></li><li><button type="button"><span class="t">Hine Ma Tov</span></button></li></ol>
    <div class="actions">
      <button class="chip" id="share">Share</button>
      <button class="chip" id="share-at" hidden>Share from 0:00</button>
    </div>
  </div>
</main>

<section class="stay" aria-labelledby="stay-title">
  <div class="stay-in">
    <h2 id="stay-title">Stay in touch</h2>
    <p>Occasional notes on new music and places to gather.</p>
    <iframe class="signup-frame" id="signup-frame" src="/signup.html" title="Join the IVRAHIM mailing list" loading="lazy"></iframe>
    <p class="signup-confirmation" id="signup-confirmation" role="status" tabindex="-1" hidden>You&rsquo;re on the list. Thank you for listening :)</p>
    <div class="ctas">
      <a class="cta" href="mailto:hello@ivrahim.com?subject=Ivrahim">Email me</a>
      <a class="cta ghost" href="https://cal.com/axelmansoor/chat" target="_blank" rel="noopener">Let&rsquo;s chat</a>
    </div>
  </div>
</section>

<footer><p>IVRAHIM &middot; More at <a href="/">ivrahim.com</a></p></footer>

<script>
(function(){
  var frame = document.getElementById('signup-frame');
  var confirmation = document.getElementById('signup-confirmation');
  addEventListener('message', function(event){
    if (event.source !== frame.contentWindow) return;
    var data = event.data;
    if (event.origin === location.origin && data && data.type === 'ivrahim-signup-height') {
      var height = Number(data.height);
      if (Number.isFinite(height) && height > 0 && height < 2000) frame.style.height = height + 'px';
    }
    if (event.origin === 'https://submit.jotform.com' && data &&
        data.action === 'submission-completed' && data.formID === '262986536126063') {
      frame.hidden = true;
      confirmation.hidden = false;
      confirmation.focus({preventScroll:true});
    }
    if (event.origin === 'https://submit.jotform.com' && typeof data === 'string' &&
        /^setHeight:\d+:262986536126063$/.test(data)) {
      frame.style.height = Math.min(1200, Math.max(230, Number(data.split(':')[1]))) + 'px';
    }
  });
})();
</script>

<script>
(function(){
  var TRACKS = [{"title": "Lecha Dodi", "desc": "Classic Jewish hymn to welcome in a restful weekend.", "src": "/audio/lecha-dodi-2026-10-24.mp3", "duration": 226}, {"title": "Adon Olam", "desc": "A thousand-year-old hymn praising the power of mystery.", "src": "/audio/adon-olam-2026-10-24.mp3", "duration": 270}, {"title": "Hine Ma Tov", "desc": "How good it is to sit with brothers and sisters.", "src": "/audio/hine-ma-tov-2026-10-24.mp3", "duration": 229}];
  var SET = null;
  var COVER = "https://ivrahim.com/img/listen-cover.jpg";

  var audio = new Audio();
  audio.preload = "metadata";
  var card = document.getElementById("card");
  var playBtn = document.getElementById("play");
  var seek = document.getElementById("seek");
  var cur = document.getElementById("cur");
  var dur = document.getElementById("dur");
  var title = document.getElementById("title");
  var desc = document.getElementById("desc");
  var shareBtn = document.getElementById("share");
  var shareAt = document.getElementById("share-at");
  var rows = Array.prototype.slice.call(document.querySelectorAll(".tracks button"));
  var i = 0, seeking = false, pending = 0;

  // a ?t= start or a scrub before playback waits until the file can seek
  audio.addEventListener("loadedmetadata", function(){
    if (pending) { audio.currentTime = pending; pending = 0; }
  });

  function fmt(s){ s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); }
  function parseT(v){
    if (!v) return 0;
    var m = String(v).match(/^(?:(\d+)m)?(\d+)s?$|^(\d+):(\d{1,2})$/);
    if (!m) return 0;
    return m[3] ? +m[3] * 60 + +m[4] : (+(m[1] || 0)) * 60 + +m[2];
  }

  function fill(t, d){
    seek.max = Math.floor(d) || seek.max;
    if (!seeking) seek.value = Math.floor(t);
    seek.style.setProperty("--p", (d ? t / d * 100 : 0) + "%");
    cur.textContent = fmt(t);
    dur.textContent = fmt(d);
  }

  function load(n, at){
    i = n;
    var t = TRACKS[i];
    audio.src = t.src;
    title.textContent = t.title;
    desc.textContent = t.desc;
    rows.forEach(function(r, k){ r.classList.toggle("on", k === i); r.setAttribute("aria-current", k === i ? "true" : "false"); });
    fill(at || 0, t.duration);
    pending = at || 0;
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title, artist: "IVRAHIM", album: SET || "IVRAHIM",
        artwork: [{src: COVER, sizes: "1000x1000", type: "image/jpeg"}]
      });
    }
  }

  function toggle(){ if (audio.paused) audio.play().catch(function(){}); else audio.pause(); }
  function go(n){ if (n < 0 || n >= TRACKS.length) return; load(n); audio.play().catch(function(){}); }

  playBtn.addEventListener("click", toggle);
  rows.forEach(function(r, k){
    r.addEventListener("click", function(){ if (k === i) toggle(); else go(k); });
  });

  seek.addEventListener("input", function(){
    seeking = true;
    fill(+seek.value, audio.duration || TRACKS[i].duration);
  });
  seek.addEventListener("change", function(){
    seeking = false;
    if (audio.readyState > 0) audio.currentTime = +seek.value;
    else load(i, +seek.value);
  });

  function paint(){
    var on = !audio.paused;
    card.classList.toggle("playing", on);
    playBtn.setAttribute("aria-label", on ? "Pause" : "Play");
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = on ? "playing" : "paused";
  }
  audio.addEventListener("play", paint);
  audio.addEventListener("pause", paint);
  audio.addEventListener("timeupdate", function(){
    if (pending) return;
    fill(audio.currentTime, audio.duration || TRACKS[i].duration);
    var t = Math.floor(audio.currentTime);
    shareAt.hidden = t < 5;
    shareAt.textContent = "Share from " + fmt(t);
  });
  audio.addEventListener("ended", function(){
    if (i < TRACKS.length - 1) go(i + 1);
    else { audio.currentTime = 0; paint(); }
  });

  function linkAt(t){
    var u = location.origin + location.pathname;
    var q = [];
    if (TRACKS.length > 1 && (t || i)) q.push("track=" + (i + 1));
    if (t) q.push("t=" + fmt(t));
    return q.length ? u + "?" + q.join("&") : u;
  }
  function share(btn, url){
    var label = btn.textContent;
    if (navigator.share) {
      navigator.share({title: document.title, url: url}).catch(function(){});
      return;
    }
    function done(){ btn.textContent = "Link copied"; setTimeout(function(){ btn.textContent = label; }, 1600); }
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function(){ prompt("Copy this link", url); });
    else prompt("Copy this link", url);
  }
  shareBtn.addEventListener("click", function(){ share(shareBtn, location.origin + location.pathname); });
  shareAt.addEventListener("click", function(){ share(shareAt, linkAt(Math.floor(audio.currentTime))); });

  if ("mediaSession" in navigator) {
    var ms = navigator.mediaSession;
    ms.setActionHandler("play", function(){ audio.play(); });
    ms.setActionHandler("pause", function(){ audio.pause(); });
    ms.setActionHandler("seekto", function(e){ audio.currentTime = e.seekTime; });
    ms.setActionHandler("seekbackward", function(e){ audio.currentTime = Math.max(0, audio.currentTime - (e.seekOffset || 10)); });
    ms.setActionHandler("seekforward", function(e){ audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (e.seekOffset || 10)); });
    if (TRACKS.length > 1) {
      ms.setActionHandler("previoustrack", function(){ if (audio.currentTime > 3) audio.currentTime = 0; else go(i - 1); });
      ms.setActionHandler("nexttrack", function(){ go(i + 1); });
    }
  }

  var params = new URLSearchParams(location.search);
  var start = parseInt(params.get("track"), 10);
  load(start >= 1 && start <= TRACKS.length ? start - 1 : 0, parseT(params.get("t")));
})();
</script>
</body>
</html>
